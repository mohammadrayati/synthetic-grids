[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetic-grids"
version = "0.1.0"
description = "Read the synthetic Swiss distribution grids dataset"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "pyarrow>=12"]

[project.optional-dependencies]
pandapower = ["pandapower>=2.14", "networkx>=3", "numpy>=1.24"]

[tool.setuptools]
packages = ["synthetic_grids"]
